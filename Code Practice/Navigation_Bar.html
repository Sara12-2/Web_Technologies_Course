<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Navigation Bar</title>

    <style>

        /* Navigation Bar */

        .navbar {
            background-color: #222;
            padding: 0;
        }


        /* Remove List Styling */

        .navbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }


        /* Make Items Horizontal */

        .navbar li {
            display: inline-block;
        }


        /* Links */

        .navbar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
        }


        /* Hover */

        .navbar a:hover {
            background-color: #555;
        }


        /* Active Link */

        .navbar .active {
            background-color: green;
        }


        /* Main Content */

        .content {
            padding: 30px;
        }

    </style>
</head>

<body>


    <!-- Navigation Bar -->

    <nav class="navbar">

        <ul>

            <li>
                <a href="#" class="active">Home</a>
            </li>

            <li>
                <a href="#">About</a>
            </li>

            <li>
                <a href="#">Skills</a>
            </li>

            <li>
                <a href="#">Projects</a>
            </li>

            <li>
                <a href="#">Contact</a>
            </li>

        </ul>

    </nav>


    <!-- Page Content -->

    <div class="content">

        <h1>My Website</h1>

        <p>
            This is my website navigation bar.
        </p>

    </div>


</body>
</html>
