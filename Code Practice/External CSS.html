<!DOCTYPE html>
<html>
<head>
    <title>External CSS Practice</title>
<!-- rel means relationship. It specifies the relationship between the current document and the linked document. In this case, "stylesheet" indicates that the linked document is a CSS stylesheet that will be used to style the HTML document. -->
    <link rel="stylesheet" href="style.css">
    <!-- href means hypertext reference. It specifies the URL of the linked document. In this case, "style.css" is the path to the external CSS file that contains the styles for the HTML document. -->
</head>

<body>

    <h1>External CSS</h1>

    <p>This is my paragraph.</p>

    <button>Click Me</button>

</body>
</html>
