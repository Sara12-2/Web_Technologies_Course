<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Padding Practice</title>

    <style>

        body {
            background-color: lightgray;
        }


        /* 1. Padding on all sides */
        .box1 {
            background-color: lightblue;
            border: 3px solid blue;

            padding: 30px;

            margin: 20px;
        }


        /* 2. Individual padding */

        .box2 {
            background-color: lightgreen;
            border: 3px solid green;

            padding-top: 10px;
            padding-right: 30px;
            padding-bottom: 50px;
            padding-left: 70px;

            margin: 20px;
        }


        /* 3. One value */

        .box3 {
            background-color: lightpink;
            border: 3px solid red;

            padding: 40px;

            margin: 20px;
        }


        /* 4. Two values

           Top & Bottom = 20px
           Left & Right = 50px
        */

        .box4 {
            background-color: lightyellow;
            border: 3px solid orange;

            padding: 20px 50px;

            margin: 20px;
        }


        /* 5. Three values

           Top = 10px
           Left & Right = 30px
           Bottom = 50px
        */

        .box5 {
            background-color: lightcoral;
            border: 3px solid brown;

            padding: 10px 30px 50px;

            margin: 20px;
        }


        /* 6. Four values

           Top = 10px
           Right = 20px
           Bottom = 30px
           Left = 40px
        */

        .box6 {
            background-color: lightseagreen;
            border: 3px solid darkgreen;

            padding: 10px 20px 30px 40px;

            margin: 20px;
        }


        /* 7. Padding with width and height */

        .box7 {
            background-color: white;
            border: 5px solid black;

            width: 300px;
            height: 100px;

            padding: 30px;

            margin: 20px;
        }


        /* 8. Button Padding */

        button {
            background-color: blue;
            color: white;

            border: none;

            padding: 15px 30px;

            margin: 20px;
        }


        /* 9. Padding in a card */

        .card {
            background-color: white;
            border: 2px solid gray;
            border-radius: 10px;

            width: 300px;

            padding: 50px;

            margin: 70px;
        }

    </style>

</head>

<body>

    <h1>CSS Padding Practice</h1>


    <div class="box1">
        Padding: 30px
    </div>


    <div class="box2">
        Individual Padding
    </div>


    <div class="box3">
        Padding: 40px
    </div>


    <div class="box4">
        Padding: 20px 50px
    </div>


    <div class="box5">
        Padding: 10px 30px 50px
    </div>


    <div class="box6">
        Padding: 10px 20px 30px 40px
    </div>


    <div class="box7">
        Width, Height and Padding
    </div>


    <button>
        Click Me
    </button>


    <div class="card">

        <h2>My Card</h2>

        <p>
            This is a simple card created
            using CSS padding.
        </p>

    </div>

</body>

</html>
