<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Dropdown Menu</title>

    <style>

        /* Navigation Bar */

        .navbar {
            background-color: #222;
        }

        .navbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        .navbar li {
            display: inline-block;
            position: relative;
        }

        .navbar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
        }

        .navbar a:hover {
            background-color: #555;
        }


        /* Dropdown Menu */

        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 180px;
            box-shadow: 0 4px 8px gray;
        }


        /* Dropdown Links */

        .dropdown-menu a {
            color: black;
            padding: 12px 15px;
        }

        .dropdown-menu a:hover {
            background-color: lightgray;
        }


        /* Show Dropdown on Hover */

        .dropdown:hover .dropdown-menu {
            display: block;
        }


        /* Content */

        .content {
            padding: 30px;
        }

    </style>
</head>

<body>


    <!-- Navigation -->

    <nav class="navbar">

        <ul>

            <li>
                <a href="#">Home</a>
            </li>

            <li>
                <a href="#">About</a>
            </li>


            <!-- Dropdown -->

            <li class="dropdown">

                <a href="#">Services ▾</a>

                <div class="dropdown-menu">

                    <a href="#">Web Development</a>

                    <a href="#">AI Development</a>

                    <a href="#">Machine Learning</a>

                    <a href="#">UI/UX Design</a>

                </div>

            </li>


            <li>
                <a href="#">Projects</a>
            </li>

            <li>
                <a href="#">Contact</a>
            </li>

        </ul>

    </nav>


    <!-- Page Content -->

    <div class="content">

        <h1>My Website</h1>

        <p>
            Hover over Services to see the dropdown menu.
        </p>

    </div>


</body>
</html>
