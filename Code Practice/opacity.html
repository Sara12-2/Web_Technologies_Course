<!DOCTYPE html>
<html>
<head>
    <title>Opacity Practice</title>

    <style>
        body {
            background-color: lightgray;
        }

        .box1 {
            background-color: red;
            width: 200px;
            height: 200px;
            opacity: 1;
        }

        .box2 {
            background-color: green;
            width: 200px;
            height: 100px;
            opacity: 0.7;
        }

        .box3 {
            background-color:pink;
            width: 200px;
            height: 100px;
            opacity: 0.4;
        }

        .box4 {
            background-color: black;
            width: 200px;
            height: 100px;
            opacity: 0.1;
        }
    </style>
</head>

<body>

    <h1>CSS Opacity Practice</h1>

    <h2>Opacity: 1</h2>
    <div class="box1">100% Visible</div>

    <h2>Opacity: 0.7</h2>
    <div class="box2">70% Visible</div>

    <h2>Opacity: 0.4</h2>
    <div class="box3">40% Visible</div>

    <h2>Opacity: 0.1</h2>
    <div class="box4">10% Visible</div>

</body>
</html>
