<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Border Practice</title>

    <style>

        /* 1. Basic Border */
        .basic {
            border: 3px solid black;
            padding: 60px;
            margin: 10px;
        }

        /* 2. Border Width */
        .width {
            border-width: 5px;
            border-style: solid;
            border-color: blue;
            padding: 27px;
            margin: 20px;
        }

        /* 3. Border Style */
        .solid {
            border: 3px solid red;
            padding: 20px;
            margin: 20px;
        }

        .dashed {
            border: 3px dashed green;
            padding: 20px;
            margin: 20px;
        }

        .dotted {
            border: 3px dotted blue;
            padding: 20px;
            margin: 20px;
        }

        .double {
            border: 5px double purple;
            padding: 20px;
            margin: 20px;
        }

        /* 4. Individual Border Sides */
        .sides {
            border-top: 4px solid red;
            border-right: 4px solid blue;
            border-bottom: 4px solid green;
            border-left: 4px solid orange;

            padding: 20px;
            margin: 20px;
        }

        /* 5. Border Radius */
        .rounded {
            border: 3px solid black;
            border-radius: 50px;

            padding: 20px;
            margin: 20px;
        }

        /* 6. Different Radius */
        .different-radius {
            border: 3px solid brown;

            border-top-left-radius: 40px;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 30px;
            border-bottom-left-radius: 10px;

            padding: 20px;
            margin: 20px;
        }

        /* 7. Circle */
        .circle {
            width: 160px;
            height: 160px;

            background-color: orange;

            border: 5px solid black;
            border-radius: 60%;

            margin: 20px;
        }

        /* 8. Border None */
        .none {
            border: none;
            background-color: lightgray;

            padding: 20px;
            margin: 20px;
        }

        /* 9. Border Individual Width */
        .different-width {
            border-top-width: 2px;
            border-right-width: 5px;
            border-bottom-width: 8px;
            border-left-width: 12px;

            border-style: solid;
            border-color: navy;

            padding: 20px;
            margin: 20px;
        }

    </style>
</head>

<body>

    <h1>CSS Border Properties</h1>

    <div class="basic">
        Basic Border
    </div>

    <div class="width">
        Border Width
    </div>

    <div class="solid">
        Solid Border
    </div>

    <div class="dashed">
        Dashed Border
    </div>

    <div class="dotted">
        Dotted Border
    </div>

    <div class="double">
        Double Border
    </div>

    <div class="sides">
        Different Border on Each Side
    </div>

    <div class="rounded">
        Rounded Border
    </div>

    <div class="different-radius">
        Different Border Radius on Each Corner
    </div>

    <div class="circle">
    </div>

    <div class="none">
        No Border
    </div>

    <div class="different-width">
        Different Border Width on Each Side
    </div>

</body>
</html>
