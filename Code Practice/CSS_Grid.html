<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Practice</title>

    <style>

        /* Basic Grid */

        .container {
            display: grid;

            grid-template-columns: 200px 200px 200px;

            grid-template-rows: 100px 100px;

            gap: 10px;

            background-color: lightgray;

            padding: 10px;
        }

        .box {
            background-color: steelblue;
            color: white;
            font-size: 20px;

            display: grid;
            place-items: center;
        }


        /* Grid with different column sizes */

        .container2 {
            display: grid;

            grid-template-columns: 1fr 2fr 1fr;

            gap: 40px;

            margin-top: 50px;
        }

        .box2 {
            background-color: orange;
            padding: 30px;
            text-align: center;
        }


        /* Grid Column Span */

        .container3 {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 40px;

            margin-top: 50px;
        }

        .header {
            grid-column: span 3;

            background-color: purple;
            color: white;

            padding: 30px;
            text-align: center;
        }

        .content {
            background-color: lightblue;

            padding: 30px;
            text-align: center;
        }


        /* Grid Row Span */

        .container4 {
            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            grid-template-rows: 100px 100px 100px;

            gap: 10px;

            margin-top: 30px;
        }

        .big-box {
            grid-row: span 2;

            background-color: green;
            color: white;

            display: grid;
            place-items: center;
        }

    </style>
</head>

<body>

    <h1>CSS Grid Practice</h1>


    <h2>1. Basic Grid</h2>

    <div class="container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>

        <div class="box">Box 4</div>
        <div class="box">Box 5</div>
        <div class="box">Box 6</div>

    </div>


    <h2>2. Grid with fr Unit</h2>

    <div class="container2">

        <div class="box2">1fr</div>
        <div class="box2">2fr</div>
        <div class="box2">1fr</div>

    </div>


    <h2>3. Grid Column Span</h2>

    <div class="container3">

        <div class="header">
            Header
        </div>

        <div class="content">
            Box 1
        </div>

        <div class="content">
            Box 2
        </div>

        <div class="content">
            Box 3
        </div>

    </div>


    <h2>4. Grid Row Span</h2>

    <div class="container4">

        <div class="big-box">
            Big Box
        </div>

        <div class="content">
            Box 1
        </div>

        <div class="content">
            Box 2
        </div>

        <div class="content">
            Box 3
        </div>

        <div class="content">
            Box 4
        </div>

    </div>

</body>
</html>
