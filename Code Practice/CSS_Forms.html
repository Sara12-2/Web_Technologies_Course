<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Forms Practice</title>

    <style>

        /* Form Container */

        .form-container {
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            border: 1px solid gray;
            border-radius: 10px;
            box-shadow: 0 4px 10px lightgray;
        }


        /* Heading */

        h1 {
            text-align: center;
        }


        /* Labels */

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }


        /* Text Inputs */

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }


        /* Input Focus */

        input:focus,
        select:focus,
        textarea:focus {
            border: 2px solid blue;
            outline: none;
        }


        /* Radio and Checkbox */

        .option {
            margin-bottom: 15px;
        }


        /* Textarea */

        textarea {
            height: 100px;
            resize: vertical;
        }


        /* Submit Button */

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: blue;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }


        /* Button Hover */

        input[type="submit"]:hover {
            background-color: darkblue;
        }


        /* Reset Button */

        input[type="reset"] {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            background-color: white;
            cursor: pointer;
        }


        input[type="reset"]:hover {
            background-color: lightgray;
        }

    </style>
</head>

<body>

    <div class="form-container">

        <h1>Registration Form</h1>

        <form>

            <!-- Name -->

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >


            <!-- Email -->

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >


            <!-- Password -->

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


            <!-- Age -->

            <label for="age">Age</label>

            <input
                type="number"
                id="age"
                placeholder="Enter your age"
            >


            <!-- Date -->

            <label for="date">Date of Birth</label>

            <input
                type="date"
                id="date"
            >


            <!-- Gender -->

            <label>Gender</label>

            <div class="option">

                <input type="radio" name="gender" value="male">
                Male

                <input type="radio" name="gender" value="female">
                Female

            </div>


            <!-- Skills -->

            <label>Skills</label>

            <div class="option">

                <input type="checkbox">
                HTML

                <input type="checkbox">
                CSS

                <input type="checkbox">
                JavaScript

            </div>


            <!-- Country -->

            <label for="country">Country</label>

            <select id="country">

                <option>Pakistan</option>
                <option>India</option>
                <option>USA</option>
                <option>UK</option>

            </select>


            <!-- Message -->

            <label for="message">Message</label>

            <textarea
                id="message"
                placeholder="Write your message..."
            ></textarea>


            <!-- Buttons -->

            <input type="submit" value="Submit">

            <input type="reset" value="Reset">

        </form>

    </div>

</body>
</html>
