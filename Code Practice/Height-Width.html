<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Height and Width Practice</title>

    <style>

        body {
            background-color: lightgray;
        }


        /* 1. Fixed Width and Height */

        .box1 {
            width: 500px;
            height: 200px;

            background-color: lightblue;
            border: 3px solid blue;

            margin: 100px;
        }


        /* 2. Width in Percentage */

        .box2 {
            width: 70%;
            height: 300px;

            background-color: lightgreen;
            border: 3px solid green;

            margin: 20px;
        }


        /* 3. Width: 100% */

        .box3 {
            width: 100%;
            height: 100px;

            background-color: lightpink;
            border: 3px solid red;

            margin: 20px 0;
        }


        /* 4. Maximum Width */

        .box4 {
            width: 90%;
            max-width: 600px;
            height: 120px;

            background-color: lightyellow;
            border: 3px solid orange;

            margin: 20px;
        }


        /* 5. Minimum Width */

        .box5 {
            width: 300px;
            min-width: 200px;
            height: 100px;

            background-color: lightcoral;
            border: 3px solid brown;

            margin: 20px;
        }


        /* 6. Maximum Height */

        .box6 {
            width: 300px;
            max-height: 150px;

            background-color: lightseagreen;
            border: 3px solid darkgreen;

            margin: 20px;
        }


        /* 7. Minimum Height */

        .box7 {
            width: 300px;
            min-height: 150px;

            background-color: white;
            border: 3px solid black;

            margin: 20px;
        }


        /* 8. Width and Height with Padding */

        .box8 {
            width: 300px;
            height: 100px;

            padding: 20px;

            background-color: lavender;
            border: 3px solid purple;

            margin: 20px;
        }


        /* 9. Responsive Box */

        .box9 {
            width: 80%;
            max-width: 500px;
            height: auto;

            padding: 30px;

            background-color: orange;
            border: 3px solid black;

            margin: 20px;
        }


        /* 10. Full Viewport Height */

        .box10 {
            width: 300px;
            height: 30vh;

            background-color: lightsteelblue;
            border: 3px solid navy;

            margin: 20px;
        }


        /* 11. Viewport Width */

        .box11 {
            width: 50vw;
            height: 100px;

            background-color: peachpuff;
            border: 3px solid orangered;

            margin: 20px;
        }

    </style>
</head>

<body>

    <h1>CSS Height and Width</h1>


    <div class="box1">
        Fixed Width: 300px <br>
        Fixed Height: 150px
    </div>


    <div class="box2">
        Width: 50%
    </div>


    <div class="box3">
        Width: 100%
    </div>


    <div class="box4">
        Maximum Width: 600px
    </div>


    <div class="box5">
        Minimum Width
    </div>


    <div class="box6">
        Maximum Height
    </div>


    <div class="box7">
        Minimum Height
    </div>


    <div class="box8">
        Width + Height + Padding
    </div>


    <div class="box9">
        Responsive Box
    </div>


    <div class="box10">
        Height: 30vh
    </div>


    <div class="box11">
        Width: 50vw
    </div>

</body>
</html>
