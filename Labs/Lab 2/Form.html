
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete HTML Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form action="https://www.google.com" method="get" target="_blank">

        <!-- Personal Information -->
        <fieldset>

            <legend>Personal Information</legend>

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname"
                   placeholder="Enter your first name" required>
            <br><br>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname"
                   placeholder="Enter your last name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="example@gmail.com" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" minlength="6" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="03XX-XXXXXXX">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label>Gender:</label>

            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

        </fieldset>

        <br>

        <!-- Academic Information -->
        <fieldset>

            <legend>Academic Information</legend>

            <label for="degree">Select Degree:</label>

            <select id="degree" name="degree">
                <option value="">-- Select Degree --</option>
                <option value="bs">BS Computer Science</option>
                <option value="bsit">BS Information Technology</option>
                <option value="bse">BS Software Engineering</option>
                <option value="bba">BBA</option>
                <option value="other">Other</option>
            </select>

            <br><br>

            <label for="semester">Semester:</label>
            <input type="number" id="semester" name="semester"
                   min="1" max="8" placeholder="1-8">
            <br><br>

            <label for="university">University:</label>
            <input type="text" id="university" name="university"
                   value="University of Layyah">
            <br><br>

            <label for="skills">Skills:</label>
            <br>

            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="js" name="skills" value="JavaScript">
            <label for="js">JavaScript</label>

            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label>

        </fieldset>

        <br>

        <!-- Additional Information -->
        <fieldset>

            <legend>Additional Information</legend>

            <label for="city">City:</label>

            <input list="cities" id="city" name="city"
                   placeholder="Select or type your city">

            <datalist id="cities">
                <option value="Layyah">
                <option value="Lahore">
                <option value="Islamabad">
                <option value="Multan">
                <option value="Karachi">
            </datalist>

            <br><br>

            <label for="website">Portfolio Website:</label>
            <input type="url" id="website" name="website"
                   placeholder="https://example.com">
            <br><br>

            <label for="color">Favorite Color:</label>
            <input type="color" id="color" name="color">
            <br><br>

            <label for="experience">Programming Experience:</label>
            <input type="range" id="experience" name="experience"
                   min="0" max="10" value="5">
            <br><br>

            <label for="file">Upload Resume:</label>
            <input type="file" id="file" name="file">
            <br><br>

            <label for="message">Why do you want to join?</label>
            <br>

            <textarea id="message" name="message"
                      rows="6" cols="40"
                      placeholder="Write your answer here..."></textarea>

        </fieldset>

        <br>

        <!-- Agreement -->
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">
            I agree to the terms and conditions.
        </label>

        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Submit Form">

        <input type="reset" value="Reset Form">

        <button type="button" onclick="alert('Thank you for filling the form!')">
            Click Me
        </button>

    </form>

</body>
</html>
